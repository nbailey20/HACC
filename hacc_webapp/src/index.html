<!DOCTYPE html>
<html>

<head>
  <title>API Gateway + Cognito Demo</title>
</head>

<body>
  <h1>API Gateway + Cognito + Lambda Demo</h1>
  <input type="text" id="searchInput" placeholder="Enter search term">
  <button id="callApi">Call Lambda</button>
  <pre id="output"></pre>

  <script>
    // ===== CONFIGURATION =====
    const SEARCH_URL = '${API_URL}/search';
    const AUTH_CHECK_URL = '${API_URL}/auth-check';
    const COGNITO_DOMAIN = '${COGNITO_DOMAIN}';
    const REDIRECT_URL = '${API_URL}/callback';
    const CLIENT_ID = '${CLIENT_ID}';
    const SCOPE = 'email+openid';
    const LOGIN_URL = `https://$${COGNITO_DOMAIN}/login?client_id=$${CLIENT_ID}&response_type=code&scope=$${SCOPE}&redirect_uri=$${encodeURIComponent(REDIRECT_URL)}`;

    // ===== AUTH CHECK =====
    async function checkAuth() {
      try {
        const response = await fetch(AUTH_CHECK_URL, {
          method: 'GET',
          credentials: 'include'
        });

        // Only 2xx responses (authenticated)
        if (response.ok) {
          return true;
        }

        // Redirect to login for 401 Unauthorized
        if (response.status === 401) {
          window.location.href = LOGIN_URL;
          return false;
        }

        // Any other error (404, 500, etc.) is treated as unauthenticated
        return false;
      } catch (err) {
        console.error('Auth check exception:', err);
        return false;
      }
    }

    // ===== API CALL =====
    async function callApi() {
      const searchTerm = document.getElementById('searchInput').value;

      try {
        const response = await fetch(SEARCH_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ query: searchTerm }),
          credentials: 'include'
        });

        if (response.status === 401) {
          window.location.href = LOGIN_URL;
          return;
        }

        const data = await response.json();
        document.getElementById('output').textContent =
          JSON.stringify(data, null, 2);

      } catch (err) {
        document.getElementById('output').textContent =
          JSON.stringify({ error: err.message }, null, 2);
      }
    }

    // ===== INIT =====
    document.getElementById('callApi').addEventListener('click', callApi);

    document.addEventListener('DOMContentLoaded', async () => {
      const isAuthenticated = await checkAuth();

      // Disable UI until authenticated
      if (!isAuthenticated) {
        document.getElementById('callApi').disabled = true;
      }
    });
  </script>
</body>
</html>
